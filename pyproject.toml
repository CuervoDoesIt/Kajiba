[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kajiba"
version = "0.1.0"
description = "Community data pipeline for open-source local model improvement — forging better training data from real-world usage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Kajiba Contributors"},
]
keywords = ["llm", "training-data", "hermes-agent", "data-pipeline", "pii-scrubbing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
upload = ["huggingface_hub>=0.19"]
llm-scrub = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = [
    "kajiba[upload]",
    "kajiba[llm-scrub]",
    "kajiba[dev]",
]

[project.scripts]
kajiba = "kajiba.cli:cli"

[project.urls]
Homepage = "https://github.com/kajiba-project/kajiba"
Documentation = "https://github.com/kajiba-project/kajiba/tree/main/docs"
Repository = "https://github.com/kajiba-project/kajiba"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["kajiba"]
omit = ["tests/*"]
